[project]
name = "youbot"
version = "0.1.0"
description = "Modelo cinematico y dinamico del KUKA youBot y control servo visual, reconstruido en 2026"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "roboticstoolbox-python>=1.1",
    "sympy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
